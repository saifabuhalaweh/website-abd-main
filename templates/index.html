<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIKY Intelligence — Company Research Platform</title>
    <meta name="description" content="AI-powered company discovery, enrichment, and intelligence matrix.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 h-screen flex flex-col antialiased">

    <!-- Nav -->
    <nav class="bg-white border-b border-slate-200 px-4 sm:px-6 flex flex-wrap sm:flex-nowrap items-center justify-between py-3 sm:py-0 sm:h-14 shrink-0 shadow-sm gap-3">
        <div class="flex items-center gap-1.5">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-blue-600 flex items-center justify-center shrink-0">
                <span class="text-white text-sm font-bold">M</span>
            </div>
            <span class="font-bold text-slate-800 text-sm tracking-tight">MIKY</span>
        </div>
        <div class="flex gap-1.5 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0 hide-scrollbar">
            <a href="/search" class="px-4 py-2.5 rounded-lg text-sm font-semibold text-slate-500 hover:bg-slate-100 hover:text-slate-700 transition-colors whitespace-nowrap min-h-[44px] flex items-center">🔍 Discovery Search</a>
            <a href="/matrix" class="px-4 py-2.5 rounded-lg text-sm font-semibold text-slate-500 hover:bg-slate-100 hover:text-slate-700 transition-colors whitespace-nowrap min-h-[44px] flex items-center">📊 Matrix Hub</a>
        </div>
    </nav>

    <!-- Hero -->
    <div class="flex-1 flex items-center justify-center px-6">
        <div class="text-center max-w-xl">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-blue-600 flex items-center justify-center mx-auto mb-6 shadow-lg shadow-indigo-200">
                <span class="text-white text-2xl font-bold">M</span>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 mb-3">MIKY Intelligence</h1>
            <p class="text-slate-500 text-base mb-8 leading-relaxed">A comprehensive company and market research system. Discover new leads, enrich data with AI, and manage your intelligence matrix — all in one place.</p>
            <div class="flex gap-3 justify-center flex-col sm:flex-row w-full">
                <a href="/search" class="inline-flex justify-center items-center gap-2 px-6 py-3.5 rounded-xl text-sm font-semibold bg-gradient-to-r from-emerald-500 to-teal-500 text-white shadow-md hover:shadow-lg hover:from-emerald-600 hover:to-teal-600 transition-all min-h-[44px] w-full sm:w-auto">
                    🔍 Discovery Search
                </a>
                <a href="/matrix" class="inline-flex justify-center items-center gap-2 px-6 py-3.5 rounded-xl text-sm font-semibold bg-gradient-to-r from-indigo-500 to-blue-600 text-white shadow-md hover:shadow-lg hover:from-indigo-600 hover:to-blue-700 transition-all min-h-[44px] w-full sm:w-auto">
                    📊 Matrix Hub
                </a>
            </div>
        </div>
    </div>
</body>
</html>
